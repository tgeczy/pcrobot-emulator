name = pcrobot
summary = "PC-ROBOT (MULTIVOX) Hungarian speech synthesizer"
description = """Speaks with PC-ROBOT / RobotVOX, the Hungarian speech synthesizer made by
Nikol Elektronika in 1994 — the software descendant of the MULTIVOX formant
synthesizer developed at the Hungarian Academy of Sciences' phonetics laboratory.

The original DOS engine (SBDD.EXE and ROBOTVOX.EXE) is run in DOSBox-X with its
mixer muted; the audio the sound card would have played is captured and handed to
NVDA. The voice is therefore the genuine 1994 article, not a re-implementation.

DOSBox-X (GPL v2, https://dosbox-x.com/) is bundled inside the add-on, so no
separate installation is needed. Two voices, plus rate, pitch, volume,
articulation and whisper.

Engine and voice data are © Nikol Elektronika, Budapest. Published with the
express written permission of the authors, Olaszy Gábor and Nikléczy Péter
(NIKOL, August 2026)."""
author = "tgeczy"
url = https://github.com/tgeczy/pcrobot-emulator
version = 1.0.0
docFileName = readme.html
minimumNVDAVersion = 2019.3
lastTestedNVDAVersion = 2026.1
